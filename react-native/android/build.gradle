import groovy.xml.XmlSlurper

buildscript {
  // Only needed when opening android/ stand-alone. When this library is consumed as a
  // module dependency the app's root buildscript supplies AGP, and declaring it here
  // is a redundant download and a classpath conflict risk.
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
    }

    dependencies {
      classpath 'com.android.tools.build:gradle:8.1.0'
    }
  }
}

apply plugin: 'com.android.library'

// Resolve exactly one native artifact from the copied Maven repository. Its
// version is independent of the React Native package version.
def ffmpegKitMavenRepository = file('libs-maven')
def ffmpegKitModuleDirectory = new File(ffmpegKitMavenRepository, 'com/arthenica/ffmpeg-kit-next')
def ffmpegKitPomFiles = fileTree(dir: ffmpegKitModuleDirectory, include: '*/ffmpeg-kit-next-*.pom').files.sort()
if (ffmpegKitPomFiles.size() != 1) {
  throw new GradleException("Expected exactly one FFmpegKit native version in ${ffmpegKitModuleDirectory}, found ${ffmpegKitPomFiles.size()}. Run copy_local_binaries.sh android with a bundle containing one version.")
}

def ffmpegKitPomFile = ffmpegKitPomFiles[0]
def ffmpegKitPom = new XmlSlurper().parse(ffmpegKitPomFile)
def ffmpegKitNativeVersion = ffmpegKitPom.version.text().trim()
if (ffmpegKitPom.groupId.text() != 'com.arthenica' ||
    ffmpegKitPom.artifactId.text() != 'ffmpeg-kit-next' ||
    !ffmpegKitNativeVersion ||
    ffmpegKitPomFile.parentFile.name != ffmpegKitNativeVersion ||
    ffmpegKitPomFile.name != "ffmpeg-kit-next-${ffmpegKitNativeVersion}.pom") {
  throw new GradleException("FFmpegKit POM does not match its Maven coordinates: ${ffmpegKitPomFile}")
}
def ffmpegKitAarFile = new File(ffmpegKitPomFile.parentFile, "ffmpeg-kit-next-${ffmpegKitNativeVersion}.aar")
if (!ffmpegKitAarFile.isFile()) {
  throw new GradleException("Missing FFmpegKit native AAR: ${ffmpegKitAarFile}. Run copy_local_binaries.sh android again.")
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

// New Architecture: registers this library's codegen tasks, which read
// `codegenConfig` from package.json and generate NativeFFmpegKitReactNativeModuleSpec.
if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  namespace 'com.arthenica.ffmpegkit.reactnative'

  compileSdkVersion 34

  defaultConfig {
    minSdkVersion 24
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
}

repositories {
  mavenCentral()
  google()

  // Reserve this module for the copied local native bundle on every RN path.
  exclusiveContent {
    forRepository {
      maven {
        url ffmpegKitMavenRepository
      }
    }
    filter {
      includeModule('com.arthenica', 'ffmpeg-kit-next')
    }
  }

  def found = false
  def defaultDir = null
  def androidSourcesName = 'React Native sources'

  if (rootProject.ext.has('reactNativeAndroidRoot')) {
    defaultDir = rootProject.ext.get('reactNativeAndroidRoot')
  } else {
    defaultDir = new File(
      projectDir,
      'node_modules/react-native/android'
    )
  }

  if (defaultDir.exists()) {
    maven {
      url defaultDir.toString()
      name androidSourcesName
    }

    logger.info(":${project.name}:reactNativeAndroidRoot ${defaultDir.canonicalPath}")
    found = true
  } else {
    def parentDir = rootProject.projectDir

    1.upto(5, {
      if (found) return true
      parentDir = parentDir.parentFile

      def androidSourcesDir = new File(
        parentDir,
        'node_modules/react-native'
      )

      def androidPrebuiltBinaryDir = new File(
        parentDir,
        'node_modules/react-native/android'
      )

      if (androidPrebuiltBinaryDir.exists()) {
        maven {
          url androidPrebuiltBinaryDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidPrebuiltBinaryDir.canonicalPath}")
        found = true
      } else if (androidSourcesDir.exists()) {
        maven {
          url androidSourcesDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidSourcesDir.canonicalPath}")
        found = true
      }
    })
  }

  if (!found) {
    throw new GradleException(
      "${project.name}: unable to locate React Native android sources. " +
        "Ensure you have you installed React Native as a dependency in your project and try again."
    )
  }
}

dependencies {
  api 'com.facebook.react:react-native:+'
  // Locally built FFmpegKit AAR resolved from the android/libs-maven Maven repo.
  implementation('com.arthenica:ffmpeg-kit-next') {
    version {
      strictly ffmpegKitNativeVersion
    }
  }
}
