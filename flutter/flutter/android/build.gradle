import groovy.xml.XmlSlurper

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Resolve exactly one native artifact from the repository copied by
// copy_local_binaries.sh. Its version is independent of the Flutter package.
def ffmpegKitMavenRepository = file('libs-maven')
def ffmpegKitModuleDirectory = new File(ffmpegKitMavenRepository, 'com/arthenica/ffmpeg-kit-next')
def ffmpegKitPomFiles = fileTree(dir: ffmpegKitModuleDirectory, include: '*/ffmpeg-kit-next-*.pom').files.sort()
if (ffmpegKitPomFiles.size() != 1) {
    throw new GradleException("Expected exactly one FFmpegKit native version in ${ffmpegKitModuleDirectory}, found ${ffmpegKitPomFiles.size()}. Run copy_local_binaries.sh android with a bundle containing one version.")
}

def ffmpegKitPomFile = ffmpegKitPomFiles[0]
def ffmpegKitPom = new XmlSlurper().parse(ffmpegKitPomFile)
def ffmpegKitNativeVersion = ffmpegKitPom.version.text().trim()
if (ffmpegKitPom.groupId.text() != 'com.arthenica' ||
        ffmpegKitPom.artifactId.text() != 'ffmpeg-kit-next' ||
        !ffmpegKitNativeVersion ||
        ffmpegKitPomFile.parentFile.name != ffmpegKitNativeVersion ||
        ffmpegKitPomFile.name != "ffmpeg-kit-next-${ffmpegKitNativeVersion}.pom") {
    throw new GradleException("FFmpegKit POM does not match its Maven coordinates: ${ffmpegKitPomFile}")
}
def ffmpegKitAarFile = new File(ffmpegKitPomFile.parentFile, "ffmpeg-kit-next-${ffmpegKitNativeVersion}.aar")
if (!ffmpegKitAarFile.isFile()) {
    throw new GradleException("Missing FFmpegKit native AAR: ${ffmpegKitAarFile}. Run copy_local_binaries.sh android again.")
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.arthenica.ffmpegkit.flutter'
    }

    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        disable 'GradleCompatible'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    // FFmpegKit native AAR is built locally with android.sh/nix-android.sh
    // and copied as a local Maven repository into android/libs-maven by
    // copy_local_binaries.sh. No remote binary repository is used.
    exclusiveContent {
        forRepository {
            maven {
                url ffmpegKitMavenRepository
            }
        }
        filter {
            includeModule('com.arthenica', 'ffmpeg-kit-next')
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.8.1'
    implementation 'androidx.annotation:annotation:1.5.0'
    // Locally built FFmpegKit AAR resolved from the android/libs-maven Maven repo.
    implementation('com.arthenica:ffmpeg-kit-next') {
        version {
            strictly ffmpegKitNativeVersion
        }
    }
}
